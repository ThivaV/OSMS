[project]
name = "osms-backend"
version = "0.1.0"
description = "OSMS backend: ingestion, story clustering, claims and the overnight agent."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "feedparser>=6.0.11",
    "httpx>=0.28",
    "milvus-lite>=2.5",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pymilvus>=2.5",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
models = [
    "flagembedding>=1.3",
    "torch>=2.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
extend-exclude = ["app/db/migrations/versions"]
