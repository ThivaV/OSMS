name: osms
description: "OSMS: One Story, Many Sources"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  go_router: ^18.1.1
  http: ^1.6.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled, not fetched from a font CDN at runtime. All SIL Open Font License
  # (OFL.txt next to each font).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/newsreader/Newsreader-Variable.ttf
        - asset: assets/fonts/newsreader/Newsreader-Italic-Variable.ttf
          style: italic
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/noto_sans_tamil/NotoSansTamil-Variable.ttf
