include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    # Its own project, analyzed on its own (`cd widgetbook && flutter analyze`). From here,
    # a fresh checkout has no packages for it yet: CI failed on exactly that.
    - widgetbook/**
