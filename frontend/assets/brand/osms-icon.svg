<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="OSMS">
  <!-- OSMS: many source threads converge into one story thread (the app's own story art).
       macOS icon grid: an 824-point body with 185-point corners on a 1024 canvas. -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D2A37"/>
      <stop offset="1" stop-color="#17161B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="126%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ink)" filter="url(#shadow)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M196 318 C 380 318 452 512 596 512" stroke="#B9A2FF" stroke-width="24"/>
    <path d="M196 430 C 360 430 470 512 596 512" stroke="#A3B1C8" stroke-width="24"/>
    <path d="M196 594 C 360 594 470 512 596 512" stroke="#E3A3B5" stroke-width="24"/>
    <path d="M196 706 C 380 706 452 512 596 512" stroke="#C3B3DB" stroke-width="24"/>
    <path d="M596 512 C 690 512 730 474 828 474" stroke="#F7F6F3" stroke-width="48"/>
  </g>
  <circle cx="596" cy="512" r="44" fill="#F7F6F3"/>
  <circle cx="596" cy="512" r="20" fill="#6440C8"/>
</svg>
