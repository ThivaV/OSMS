name: check

on:
  push:
    branches: [main]
  pull_request:

# A green run of this workflow on main is what deploys (deploy.yml).
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# The versions the author builds with (README, What you need).
env:
  FLUTTER_VERSION: 3.47.8
  UV_PYTHON: "3.13"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - run: flutter test
        working-directory: frontend
      - run: flutter pub get
        working-directory: frontend/widgetbook
      - run: flutter analyze
        working-directory: frontend/widgetbook
      - run: flutter test
        working-directory: frontend/widgetbook

  # The macOS desktop app compiles (debug, signed to run locally).
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build macos --debug
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.1
          enable-cache: true
      # Without the `models` extra: the tests use fakes, and torch is gigabytes.
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest
        working-directory: eval

  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: auth/package-lock.json
      - run: npm ci
        working-directory: auth
      - run: npm run typecheck
        working-directory: auth
      - run: npm test
        working-directory: auth
