name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - run: flutter test
        working-directory: frontend
      - run: flutter pub get
        working-directory: frontend/widgetbook
      - run: flutter analyze
        working-directory: frontend/widgetbook
      - run: flutter test
        working-directory: frontend/widgetbook

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check .
        working-directory: backend
      - run: pytest -q
        working-directory: backend
